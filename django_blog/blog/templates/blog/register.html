<!DOCTYPE html>
<html>
<head>
    <title>Register | Django Blog</title>
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body>

<h2>Create a New Account</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    {% if form.errors %}
        <div class="error">
            {{ form.errors }}
        </div>
    {% endif %}

    <button type="submit">Register</button>
</form>

<p>
    Already have an account?
    <a href="{% url 'login' %}">Login Here</a>
</p>

</body>
</html>
