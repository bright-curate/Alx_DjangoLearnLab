{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Edit Comment</title>
  <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body>
  <h1>Edit Comment</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'post-detail' form.instance.post.pk %}">Cancel</a>
  </form>
</body>
</html>
